<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        const devModeStartup = false; // Set to true for ID-only display (no images/names)
        let displayMode = devModeStartup ? 'dev' : 'normal'; // 'dev' for IDs, 'normal' for images
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ranking - Visual Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f7ff 0%, #f5f5f5 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(102, 126, 234, 0.02) 2px, rgba(102, 126, 234, 0.02) 4px);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .about-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .about-link:hover {
            color: #764ba2;
        }

        .display-toggle {
            position: absolute;
            top: 20px;
            right: 150px;
            background: none;
            border: 1px solid #ddd;
            color: #667eea;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            display: none;
        }

        .display-toggle:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .display-toggle.visible {
            display: inline-block;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .selection-section {
            display: none;
        }

        .selection-section.active {
            display: block;
        }

        .watch-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .watch-box {
            width: 180px;
            height: 180px;
            flex-shrink: 0;
            aspect-ratio: 1;
            border: 3px solid #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            user-select: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .watch-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .watch-box.selected-top {
            border: 4px solid #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
        }

        .watch-box.selected-bottom {
            border: 4px solid #f44336;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.6);
        }

        .selection-info {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            text-align: center;
        }

        .selection-info div {
            text-align: center;
        }
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .button-group.hidden {
            display: none;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ccc;
        }

        .btn-back {
            background: none;
            border: none;
            color: #999;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .btn-back:hover {
            color: #666;
        }

        .comparison-section {
            display: none;
        }

        .comparison-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .watch-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: box-shadow 0.3s, border 0.3s;
            display: flex;
            flex-direction: column;
            border: 3px solid transparent;
        }

        .watch-card:hover {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(102, 126, 234, 0.4);
            border: 3px solid rgba(102, 126, 234, 0.5);
        }

        .watch-card.selected {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 25px rgba(76, 175, 80, 0.6);
            border: 3px solid #4caf50;
        }

        .watch-image {
            width: 100%;
            max-width: 500px;
            height: 350px;
            max-height: 350px;
            object-fit: cover;
            display: block;
            flex: 1;
        }

        .watch-label {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .vs-text {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 0 15px;
        }

        .comparison .watch-card img {
            max-width: 500px;
            max-height: 350px;
            height: 350px;
        }

        .comparison-info {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .results-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .results-section.active {
            display: block;
        }

        .results-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 2rem;
        }

        .ranked-list {
            list-style: none;
            max-width: 600px;
            margin: 0 auto;
        }

        .ranked-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 15px;
            border-top: 4px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .rank-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .rank-image {
            width: 600px;
            height: 400px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .watch-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .results-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .tier-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .tier-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #999;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="displayToggle" class="display-toggle" onclick="toggleDisplayMode()">Show Images</button>
        <a href="about.html" class="about-link">? How it works</a>
        
        <!-- Selection Section - Top 5 -->
        <div class="selection-section active" id="selectionSectionTop">
            <h1>Watch Ranking Tool</h1>
            <p class="instructions">
                Select your 5 favorite watches
            </p>

            <div class="selection-info">
                <div>
                    <div class="selection-count" id="topCount">0 / 5</div>
                    <div style="font-size: 0.9rem; color: #666;">Top 5 Selected</div>
                </div>
            </div>

            <div class="watch-grid" id="watchGrid"></div>
            
            <div id="devSkipButton" style="display: none; text-align: center; margin-top: 20px;">
                <button class="btn-primary" onclick="skipToResults()">⚡ Skip to Results (Dev)</button>
            </div>
        </div>

        <!-- Selection Section - Bottom 5 -->
        <div class="selection-section" id="selectionSectionBottom">
            <h1>Watch Ranking Tool</h1>
            <p class="instructions">
                Select your 5 least favorite watches
            </p>

            <div class="selection-info">
                <div>
                    <div class="selection-count" id="bottomCount">0 / 5</div>
                    <div style="font-size: 0.9rem; color: #666;">Bottom 5 Selected</div>
                </div>
            </div>

            <div class="watch-grid" id="watchGridBottom"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn-back" onclick="backToTopSelection()">← Back</button>
            </div>
        </div>
        <div class="comparison-section" id="comparisonSection">
            <h1 id="comparisonTitle">Which do you prefer?</h1>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText"></div>

            <div class="comparison">
                <div class="watch-card" id="watch1" onclick="selectWinner(1)">
                    <img id="image1" class="watch-image" alt="Watch">
                    <div class="watch-label" id="label1"></div>
                </div>
                <div class="vs-text">VS</div>
                <div class="watch-card" id="watch2" onclick="selectWinner(2)">
                    <img id="image2" class="watch-image" alt="Watch">
                    <div class="watch-label" id="label2"></div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <h2 class="results-title">Your Watch Rankings</h2>
            <ul class="ranked-list" id="rankedList"></ul>

            <div class="results-buttons">
                <button class="btn-primary" onclick="downloadResults()">📋 Copy Rankings</button>
                <button class="btn-secondary" onclick="restart()">← Start Over</button>
            </div>
        </div>
    </div>

    <script>
        const watches = [
            { id: 6, name: 'Nomos', image: 'watch-images/watch-1.jpg' },
            { id: 4, name: 'Tag', image: 'watch-images/watch-2.jpg' },
            { id: 11, name: 'Patek', image: 'watch-images/watch-3.jpg' },
            { id: 8, name: 'Cartier', image: 'watch-images/watch-4.jpg' },
            { id: 2, name: 'Rolex', image: 'watch-images/watch-5.jpg' },
            { id: 1, name: 'GS', image: 'watch-images/watch-6.jpg' },
            { id: 3, name: 'IWC', image: 'watch-images/watch-7.jpg' },
            { id: 5, name: 'VC', image: 'watch-images/watch-8.jpg' },
            { id: 10, name: 'Lange', image: 'watch-images/watch-9.jpg' },
            { id: 9, name: 'JLC', image: 'watch-images/watch-10.jpg' },
            { id: 7, name: 'Omega', image: 'watch-images/watch-11.png' }
        ];

        let selectedTop = new Set();
        let selectedBottom = new Set();
        let middleWatches = [];
        let allWatches = [];
        let currentPass = 0;
        let currentIndex = 0;
        let completedComparisons = 0;
        let totalComparisons = 0;
        let comparisonLimit = 0;

        function initializeSelection() {
            const grid = document.getElementById('watchGrid');
            grid.innerHTML = '';

            watches.forEach(watch => {
                const box = document.createElement('div');
                box.className = 'watch-box';
                
                if (displayMode === 'dev') {
                    box.textContent = watch.id;
                    box.style.fontSize = '2.5rem';
                    box.style.fontWeight = 'bold';
                    box.style.background = '#f0f0f0';
                } else {
                    box.style.backgroundImage = `url('${watch.image}')`;
                }
                
                box.dataset.id = watch.id;
                box.onclick = () => toggleSelection(watch.id);
                grid.appendChild(box);
            });
            
            // Show dev skip button if dev mode startup is enabled
            if (devModeStartup) {
                document.getElementById('devSkipButton').style.display = 'block';
            }
            
            updateDisplayToggle();
        }

        function toggleSelection(watchId) {
            const selectionMode = document.getElementById('selectionSectionTop').classList.contains('active') ? 'top' : 'bottom';
            
            // Find the correct box based on which grid is active
            let box;
            if (selectionMode === 'top') {
                box = document.getElementById('watchGrid').querySelector(`[data-id="${watchId}"]`);
            } else {
                box = document.getElementById('watchGridBottom').querySelector(`[data-id="${watchId}"]`);
            }
            
            if (!box) return;
            
            if (selectionMode === 'top') {
                if (selectedTop.has(watchId)) {
                    selectedTop.delete(watchId);
                    box.classList.remove('selected-top');
                } else if (selectedTop.size < 5) {
                    selectedTop.add(watchId);
                    box.classList.add('selected-top');
                    
                    // Auto-advance when 5th item selected
                    if (selectedTop.size === 5) {
                        setTimeout(() => moveToBottomSelection(), 300);
                    }
                }
                updateSelectionUI();
            } else {
                if (selectedBottom.has(watchId)) {
                    selectedBottom.delete(watchId);
                    box.classList.remove('selected-bottom');
                } else if (selectedBottom.size < 5) {
                    selectedBottom.add(watchId);
                    box.classList.add('selected-bottom');
                }
                updateSelectionUI();
            }
        }

        function updateSelectionUI() {
            const isTopPhase = document.getElementById('selectionSectionTop').classList.contains('active');
            
            if (isTopPhase) {
                document.getElementById('topCount').textContent = `${selectedTop.size} / 5`;
            } else {
                document.getElementById('bottomCount').textContent = `${selectedBottom.size} / 5`;
                
                // Auto-advance when 5th item selected
                if (selectedBottom.size === 5) {
                    setTimeout(() => startComparisons(), 300);
                }
            }
        }

        function moveToBottomSelection() {
            document.getElementById('selectionSectionTop').classList.remove('active');
            document.getElementById('selectionSectionBottom').classList.add('active');
            
            // Update header
            document.querySelector('#selectionSectionBottom h1').textContent = 'Select your 5 least favorite watches';
            
            // Populate bottom selection grid
            const gridBottom = document.getElementById('watchGridBottom');
            gridBottom.innerHTML = '';
            
            watches.forEach(watch => {
                if (!selectedTop.has(watch.id)) {
                    const box = document.createElement('div');
                    box.className = 'watch-box';
                    
                    if (displayMode === 'dev') {
                        box.textContent = watch.id;
                        box.style.fontSize = '2.5rem';
                        box.style.fontWeight = 'bold';
                        box.style.background = '#f0f0f0';
                    } else {
                        box.style.backgroundImage = `url('${watch.image}')`;
                    }
                    
                    box.dataset.id = watch.id;
                    box.onclick = () => toggleSelection(watch.id);
                    gridBottom.appendChild(box);
                }
            });
            
            updateSelectionUI();
        }

        function backToTopSelection() {
            document.getElementById('selectionSectionBottom').classList.remove('active');
            document.getElementById('selectionSectionTop').classList.add('active');
            selectedBottom.clear();
            // Clear the bottom grid styling
            document.querySelectorAll('#watchGridBottom [data-id]').forEach(box => {
                box.classList.remove('selected-bottom');
            });
            updateSelectionUI();
        }

        function resetSelection() {
            selectedTop.clear();
            selectedBottom.clear();
            document.querySelectorAll('.watch-box').forEach(box => {
                box.classList.remove('selected-top', 'selected-bottom');
            });
            updateSelectionUI();
        }

        function skipToResults() {
            // Randomly select 5 watches as top 5
            const shuffled = [...watches].sort(() => Math.random() - 0.5);
            const topWatches = shuffled.slice(0, 5).sort((a, b) => a.id - b.id);
            const remaining = shuffled.slice(5);
            const bottomWatches = remaining.slice(0, 5).sort((a, b) => a.id - b.id);
            middleWatches = remaining.slice(5);

            allWatches = [...topWatches, ...middleWatches, ...bottomWatches];

            // Jump straight to results
            document.getElementById('selectionSectionTop').classList.remove('active');
            document.getElementById('resultsSection').classList.add('active');
            finishComparisons();
        }

        function toggleDisplayMode() {
            displayMode = displayMode === 'dev' ? 'normal' : 'dev';
            updateDisplayToggle();
            
            // Reinitialize the currently visible grid
            const isTopPhase = document.getElementById('selectionSectionTop').classList.contains('active');
            const isBottomPhase = document.getElementById('selectionSectionBottom').classList.contains('active');
            
            if (isTopPhase) {
                initializeSelection();
            } else if (isBottomPhase) {
                moveToBottomSelection();
            }
            
            if (document.getElementById('resultsSection').classList.contains('active')) {
                finishComparisons();
            }
        }

        function updateDisplayToggle() {
            const btn = document.getElementById('displayToggle');
            if (devModeStartup) {
                btn.classList.add('visible');
                btn.textContent = displayMode === 'dev' ? 'Show Images' : 'Show IDs';
            }
        }

        function startComparisons() {
            // Prepare rankings
            allWatches = [];
            
            // Normalize selection order by sorting by watch ID
            const topWatches = Array.from(selectedTop)
                .sort((a, b) => a - b)
                .map(id => watches.find(w => w.id === id));
            
            // Middle watches (unselected)
            middleWatches = watches.filter(w => 
                !selectedTop.has(w.id) && !selectedBottom.has(w.id)
            );
            
            // Bottom 5 will be placed last, also sorted by ID
            const bottomWatches = Array.from(selectedBottom)
                .sort((a, b) => a - b)
                .map(id => watches.find(w => w.id === id));

            // Initialize all watches
            allWatches = [...topWatches, ...middleWatches, ...bottomWatches];
            
            // Comparisons: top 5 needs ~10, middle 1 needs ~3, bottom 5 needs ~5-8
            comparisonLimit = 22;
            completedComparisons = 0;
            currentPass = 0;
            currentIndex = 0;

            // Hide selection, show comparison
            document.getElementById('selectionSectionBottom').classList.remove('active');
            document.getElementById('comparisonSection').classList.add('active');

            showNextComparison();
        }

        function showNextComparison() {
            // Once we've done enough comparisons, finish
            if (completedComparisons >= comparisonLimit) {
                finishComparisons();
                return;
            }

            // Start with top group (top 5 + middle)
            const topGroupSize = selectedTop.size + middleWatches.length;
            const bottomGroupStart = topGroupSize;

            // If we've finished the top group, switch to bottom group
            if (currentPass === 0 && currentIndex >= topGroupSize - 1) {
                currentPass = 1;
                currentIndex = bottomGroupStart;
            }

            // Comparison logic depends on which group
            if (currentPass === 0) {
                // Top group sorting
                if (currentIndex < topGroupSize - 1) {
                    const watch1 = allWatches[currentIndex];
                    const watch2 = allWatches[currentIndex + 1];

                    displayComparison(watch1, watch2, (watchNumber) => {
                        if (watchNumber === 2) {
                            [allWatches[currentIndex], allWatches[currentIndex + 1]] = 
                            [allWatches[currentIndex + 1], allWatches[currentIndex]];
                        }

                        currentIndex++;
                        completedComparisons++;
                        setTimeout(() => showNextComparison(), 300);
                    });
                }
            } else {
                // Bottom group rough sorting (just 1-2 passes)
                const bottomGroupEnd = allWatches.length;
                const bottomPass = currentPass - 1;

                if (bottomPass >= 2) {
                    // Done with bottom group
                    finishComparisons();
                    return;
                }

                if (currentIndex < bottomGroupEnd - 1 - bottomPass) {
                    const watch1 = allWatches[currentIndex];
                    const watch2 = allWatches[currentIndex + 1];

                    displayComparison(watch1, watch2, (watchNumber) => {
                        if (watchNumber === 2) {
                            [allWatches[currentIndex], allWatches[currentIndex + 1]] = 
                            [allWatches[currentIndex + 1], allWatches[currentIndex]];
                        }

                        currentIndex++;
                        completedComparisons++;
                        setTimeout(() => showNextComparison(), 300);
                    });
                } else {
                    // End of this pass, move to next
                    currentPass++;
                    currentIndex = bottomGroupStart;
                    showNextComparison();
                }
            }
        }

        function displayComparison(watch1, watch2, callback) {
            // Randomly swap order to avoid consistent clicking patterns
            let display1 = watch1;
            let display2 = watch2;
            const shouldSwap = Math.random() > 0.5;
            
            if (shouldSwap) {
                [display1, display2] = [display2, display1];
            }
            
            // Map clicked position back to original watch position
            const wrappedCallback = (clickedPosition) => {
                const clickedWatch = clickedPosition === 1 ? display1 : display2;
                const originalPosition = clickedWatch === watch1 ? 1 : 2;
                callback(originalPosition);
            };
            
            if (displayMode === 'dev') {
                document.getElementById('image1').style.display = 'none';
                document.getElementById('label1').textContent = display1.id;
                document.getElementById('label1').style.fontSize = '3rem';
                document.getElementById('label1').style.paddingTop = '150px';

                document.getElementById('image2').style.display = 'none';
                document.getElementById('label2').textContent = display2.id;
                document.getElementById('label2').style.fontSize = '3rem';
                document.getElementById('label2').style.paddingTop = '150px';
            } else {
                document.getElementById('image1').style.display = 'block';
                document.getElementById('label1').textContent = display1.name;
                document.getElementById('image1').src = display1.image;
                document.getElementById('label1').style.fontSize = '0.9rem';
                document.getElementById('label1').style.paddingTop = '10px';

                document.getElementById('image2').style.display = 'block';
                document.getElementById('label2').textContent = display2.name;
                document.getElementById('image2').src = display2.image;
                document.getElementById('label2').style.fontSize = '0.9rem';
                document.getElementById('label2').style.paddingTop = '10px';
            }

            const progress = Math.min((completedComparisons / comparisonLimit) * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Comparison ${completedComparisons + 1} / ${comparisonLimit}`;

            document.getElementById('watch1').classList.remove('selected');
            document.getElementById('watch2').classList.remove('selected');

            window.currentComparisonCallback = wrappedCallback;
        }

        function selectWinner(watchNumber) {
            if (window.currentComparisonCallback) {
                document.getElementById(`watch${watchNumber}`).classList.add('selected');
                window.currentComparisonCallback(watchNumber);
            }
        }

        function finishComparisons() {
            document.getElementById('comparisonSection').classList.remove('active');
            document.getElementById('resultsSection').classList.add('active');

            const rankedList = document.getElementById('rankedList');
            rankedList.innerHTML = '';

            allWatches.forEach((watch, index) => {
                const li = document.createElement('li');
                li.className = 'ranked-item';
                
                if (displayMode === 'dev') {
                    li.innerHTML = `
                        <div class="rank-number">${index + 1}</div>
                        <div class="watch-name">Watch ${watch.id}</div>
                    `;
                } else {
                    li.innerHTML = `
                        <div class="rank-number">${index + 1}</div>
                        <img class="rank-image" src="${watch.image}" alt="Watch ${watch.name}">
                        <div class="watch-name">${watch.name}</div>
                    `;
                }
                
                rankedList.appendChild(li);
            });
        }

        function downloadResults() {
            let markdown = '# My Watch Rankings\n\n';
            allWatches.forEach((watch, index) => {
                if (displayMode === 'dev') {
                    markdown += `${index + 1}. Watch ${watch.id}\n`;
                } else {
                    markdown += `${index + 1}. ${watch.name}\n`;
                }
            });

            markdown += '\n---\n\n[Create your own ranking](https://solidred.co.uk/watchvs/)\n';

            const textArea = document.createElement('textarea');
            textArea.value = markdown;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                document.execCommand('copy');
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '✓ Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            } finally {
                document.body.removeChild(textArea);
            }
        }

        function restart() {
            selectedTop.clear();
            selectedBottom.clear();
            document.getElementById('selectionSectionTop').classList.add('active');
            document.getElementById('selectionSectionBottom').classList.remove('active');
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('comparisonSection').classList.remove('active');
            initializeSelection();
            updateSelectionUI();
        }

        // Initialize on load
        window.addEventListener('load', initializeSelection);
    </script>
</body>
</html>
