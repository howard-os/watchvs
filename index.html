<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ranking - Visual Selection</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>
    <div class="container">
        <button id="displayToggle" class="display-toggle" onclick="toggleDisplayMode()">Show Images</button>
        <a href="about.html" class="about-link" id="aboutLink">? How it works</a>
        
        <!-- Selection Section - Top 5 -->
        <div class="selection-section active" id="selectionSectionTop">
            <h1>Select your 3 favorite watches</h1>

            <div class="selection-info">
                <div>
                    <div class="selection-count" id="topCount">0 / 3</div>
                    <div style="font-size: 0.9rem; color: #666;">Top 3 Selected</div>
                </div>
            </div>

            <div class="watch-grid" id="watchGrid"></div>
            
            <div id="devSkipButton" style="display: none; text-align: center; margin-top: 20px;">
                <button class="btn-primary" onclick="skipToResults()">⚡ Skip to Results (Dev)</button>
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button class="btn-secondary" onclick="loadNewSet()">🎲 Pick from different set</button>
            </div>
        </div>

        <!-- Selection Section - Bottom 5 -->
        <div class="selection-section" id="selectionSectionBottom">
            <h1>Select your 3 least favorite watches</h1>

            <div class="selection-info">
                <div>
                    <div class="selection-count" id="bottomCount">0 / 3</div>
                    <div style="font-size: 0.9rem; color: #666;">Bottom 3 Selected</div>
                </div>
            </div>

            <div class="watch-grid" id="watchGridBottom"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn-back" onclick="backToTopSelection()">← Back</button>
            </div>
        </div>

        <!-- Comparison Section -->
        <div class="comparison-section" id="comparisonSection">
            <h1>Which do you prefer?</h1>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText"></div>

            <div class="comparison">
                <div class="watch-card" id="watch1" onclick="selectWinner(1)">
                    <img id="image1" class="watch-image" alt="Watch">
                    <div class="watch-label" id="label1"></div>
                </div>
                <div class="vs-text">VS</div>
                <div class="watch-card" id="watch2" onclick="selectWinner(2)">
                    <img id="image2" class="watch-image" alt="Watch">
                    <div class="watch-label" id="label2"></div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <h2 class="results-title">Your Watch Rankings</h2>
            <ul class="ranked-list" id="rankedList"></ul>

            <div class="results-buttons">
                <button class="btn-primary" onclick="copyShareUrl()">🔗 Copy Share Link</button>
                <button class="btn-secondary" onclick="downloadResults()">📋 Copy Rankings</button>
                <button class="btn-secondary" onclick="restart()">← Start Over</button>
            </div>
            <input type="text" id="shareRankingUrl" style="display: none;">
        </div>
    </div>

    <script type="module" src="index-script.js"></script>
</body>
</html>
