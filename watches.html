<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reddit Watch Gallery - How Would You Rank These?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .source-link {
            display: inline-block;
            padding: 10px 20px;
            background: #ff4500;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .source-link:hover {
            background: #ff5722;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .watch-card {
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .watch-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 48px rgba(255, 107, 107, 0.3);
        }

        .watch-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .watch-info {
            padding: 20px;
        }

        .watch-number {
            font-size: 0.9rem;
            color: #ff6b6b;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .watch-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .watch-description {
            color: #bbb;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .stats {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 40px;
        }

        .stat-box {
            display: inline-block;
            margin: 0 20px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffd93d;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        footer {
            text-align: center;
            color: #666;
            padding-top: 40px;
            border-top: 1px solid #444;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
        }

        .modal-content {
            margin: auto;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .modal-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .close {
            position: absolute;
            right: 30px;
            top: 30px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: color 0.3s;
        }

        .close:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⌚ Watch Gallery</h1>
            <p>How Would You Rank These Based on Your Personal Preference?</p>
            <a href="https://www.reddit.com/r/Watches/comments/1x7csrj/question_how_would_you_rank_these_based_on_your/" class="source-link" target="_blank">
                View Original Reddit Post
            </a>
        </header>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">11</div>
                <div class="stat-label">Watches</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">📊</div>
                <div class="stat-label">Community Ranking</div>
            </div>
        </div>

        <div class="gallery" id="gallery"></div>

        <footer>
            <p>Images sourced from Reddit r/Watches community. Click on any watch to view full size.</p>
        </footer>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img class="modal-image" id="modalImage" src="" alt="">
        </div>
    </div>

    <script>
        const watches = [
            { id: 1, name: 'Watch 1', image: './watch-images/watch-1.jpg' },
            { id: 2, name: 'Watch 2', image: './watch-images/watch-2.jpg' },
            { id: 3, name: 'Watch 3', image: './watch-images/watch-3.jpg' },
            { id: 4, name: 'Watch 4', image: './watch-images/watch-4.jpg' },
            { id: 5, name: 'Watch 5', image: './watch-images/watch-5.jpg' },
            { id: 6, name: 'Watch 6', image: './watch-images/watch-6.jpg' },
            { id: 7, name: 'Watch 7', image: './watch-images/watch-7.jpg' },
            { id: 8, name: 'Watch 8', image: './watch-images/watch-8.jpg' },
            { id: 9, name: 'Watch 9', image: './watch-images/watch-9.jpg' },
            { id: 10, name: 'Watch 10', image: './watch-images/watch-10.jpg' },
            { id: 11, name: 'Watch 11', image: './watch-images/watch-11.png' }
        ];

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            watches.forEach(watch => {
                const card = document.createElement('div');
                card.className = 'watch-card';
                card.innerHTML = `
                    <img src="${watch.image}" alt="${watch.name}" class="watch-image" onclick="openModal(event)">
                    <div class="watch-info">
                        <div class="watch-number">#${watch.id}</div>
                        <div class="watch-title">${watch.name}</div>
                        <div class="watch-description">Click to view full size</div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function openModal(event) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = event.target.src;
            modal.style.display = 'block';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        renderGallery();
    </script>
</body>
</html>
