<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Tournament Ranker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s;
        }

        .tournament-container {
            display: none;
        }

        .tournament-container.active {
            display: block;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 20px;
            align-items: stretch;
        }

        .watch-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .watch-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .watch-card.selected {
            transform: scale(1.02) translateY(-8px);
            box-shadow: 0 20px 60px rgba(76, 175, 80, 0.5);
            border: 3px solid #4caf50;
        }

        .watch-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            flex: 1;
        }

        .watch-label {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .vs-text {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 0 15px;
        }

        .tournament-info {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .progress-text {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .results-container {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .results-container.active {
            display: block;
        }

        .results-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .ranked-list {
            list-style: none;
        }

        .ranked-item {
            display: grid;
            grid-template-columns: 80px 150px 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .ranked-item:hover {
            background: #efefef;
            transform: translateX(5px);
        }

        .rank-badge {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            min-width: 50px;
        }

        .rank-badge.first {
            color: #ffd700;
        }

        .rank-badge.second {
            color: #c0c0c0;
        }

        .rank-badge.third {
            color: #cd7f32;
        }

        .rank-badge.other {
            color: #999;
        }

        .rank-image {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .rank-info {
            flex: 1;
        }

        .rank-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .rank-note {
            font-size: 0.9rem;
            color: #666;
        }

        .restart-button, .download-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 15px;
        }

        .restart-button:hover, .download-button:hover {
            background: #764ba2;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .comparison {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .vs-text {
                writing-mode: horizontal-tb;
                padding: 10px 0;
            }

            .watch-image {
                height: 250px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .ranked-item {
                grid-template-columns: 50px 1fr;
                gap: 10px;
            }

            .rank-image {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Watch Tournament</h1>
            <p>Rank your watches by tournament style!</p>
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="tournament-info" id="tournamentInfo"></div>

        <div class="tournament-container active" id="tournamentContainer">
            <div class="comparison">
                <div class="watch-card" id="watch1" onclick="selectWinner(1)">
                    <img class="watch-image" id="image1" src="" alt="Watch 1">
                    <div class="watch-label" id="label1">Watch 1</div>
                </div>

                <div class="vs-text">VS</div>

                <div class="watch-card" id="watch2" onclick="selectWinner(2)">
                    <img class="watch-image" id="image2" src="" alt="Watch 2">
                    <div class="watch-label" id="label2">Watch 2</div>
                </div>
            </div>

            <div class="progress-text" id="progressText"></div>
        </div>

        <div class="results-container" id="resultsContainer">
            <h2>🎖️ Your Rankings</h2>
            <ol class="ranked-list" id="rankedList"></ol>
            <div class="button-container">
                <button class="restart-button" onclick="restartTournament()">Start Over</button>
                <button class="download-button" onclick="downloadResults()">📋 Copy Rankings</button>
            </div>
        </div>
    </div>

    <script>
        const watches = [
            { id: 1, name: 'Nomos', image: './watch-images/watch-1.jpg' },
            { id: 2, name: 'Tag', image: './watch-images/watch-2.jpg' },
            { id: 3, name: 'Patek', image: './watch-images/watch-3.jpg' },
            { id: 4, name: 'Cartier', image: './watch-images/watch-4.jpg' },
            { id: 5, name: 'Rolex', image: './watch-images/watch-5.jpg' },
            { id: 6, name: 'GS', image: './watch-images/watch-6.jpg' },
            { id: 7, name: 'IWC', image: './watch-images/watch-7.jpg' },
            { id: 8, name: 'VC', image: './watch-images/watch-8.jpg' },
            { id: 9, name: 'Lange', image: './watch-images/watch-9.jpg' },
            { id: 10, name: 'JLC', image: './watch-images/watch-10.jpg' },
            { id: 11, name: 'Omega', image: './watch-images/watch-11.png' }
        ];

        let allWatches = [];
        let currentPass = 0;
        let currentIndex = 0;
        let comparisonLimit = 43; // Stop after ~43 comparisons (roughly 2-3 passes)

        function initHybridSort() {
            allWatches = [...watches].sort(() => Math.random() - 0.5);
            currentPass = 0;
            currentIndex = 0;
            
            totalMatches = comparisonLimit;
            completedMatches = 0;
            
            showNextMatch();
        }

        function showNextMatch() {
            // Limit comparisons to approximately 43 (emphasizes accurate top ranking)
            if (completedMatches >= comparisonLimit) {
                finishHybridSort();
                return;
            }

            // Standard bubble sort pass logic
            if (currentIndex < allWatches.length - 1 - currentPass) {
                const watch1 = allWatches[currentIndex];
                const watch2 = allWatches[currentIndex + 1];

                displayComparison(watch1, watch2, (watchNumber) => {
                    // If user chose watch2, swap them
                    if (watchNumber === 2) {
                        [allWatches[currentIndex], allWatches[currentIndex + 1]] = 
                        [allWatches[currentIndex + 1], allWatches[currentIndex]];
                    }

                    currentIndex++;
                    completedMatches++;
                    setTimeout(() => showNextMatch(), 300);
                });
            } else {
                // End of pass, move to next pass
                currentPass++;
                currentIndex = 0;
                showNextMatch();
            }
        }

        function displayComparison(watch1, watch2, callback) {
            document.getElementById('image1').style.display = 'none';
            document.getElementById('label1').textContent = `Watch ${watch1.id}`;
            document.getElementById('label1').style.fontSize = '3rem';
            document.getElementById('label1').style.paddingTop = '150px';

            document.getElementById('image2').style.display = 'none';
            document.getElementById('label2').textContent = `Watch ${watch2.id}`;
            document.getElementById('label2').style.fontSize = '3rem';
            document.getElementById('label2').style.paddingTop = '150px';

            // Update progress
            const progress = Math.min((completedMatches / totalMatches) * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Comparison ${completedMatches + 1}`;

            document.getElementById('tournamentInfo').textContent = 
                `Which do you prefer?`;

            document.getElementById('watch1').classList.remove('selected');
            document.getElementById('watch2').classList.remove('selected');

            // Store callback for click handler
            window.currentComparisonCallback = callback;
        }

        function selectWinner(watchNumber) {
            if (window.currentComparisonCallback) {
                const watchElement = document.getElementById(`watch${watchNumber}`);
                watchElement.classList.add('selected');
                window.currentComparisonCallback(watchNumber);
            }
        }

        function finishHybridSort() {
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('tournamentContainer').classList.remove('active');
            document.getElementById('resultsContainer').classList.add('active');

            const rankedList = document.getElementById('rankedList');
            rankedList.innerHTML = '';

            allWatches.forEach((watch, index) => {
                const li = document.createElement('li');
                li.className = 'ranked-item';

                let badgeClass = 'other';
                if (index === 0) badgeClass = 'first';
                else if (index === 1) badgeClass = 'second';
                else if (index === 2) badgeClass = 'third';

                li.innerHTML = `
                    <div class="rank-badge ${badgeClass}">${index + 1}</div>
                    <img class="rank-image" src="${watch.image}" alt="Watch ${watch.id}">
                    <div class="rank-info">
                        <div class="rank-name">Watch ${watch.id}</div>
                    </div>
                `;

                rankedList.appendChild(li);
            });
        }

        function restartTournament() {
            document.getElementById('resultsContainer').classList.remove('active');
            document.getElementById('tournamentContainer').classList.add('active');
            initHybridSort();
        }

        function downloadResults() {
            let markdown = '# My Watch Rankings\n\n';
            allWatches.forEach((watch, index) => {
                markdown += `${index + 1}. Watch ${watch.id}\n`;
            });

            const textArea = document.createElement('textarea');
            textArea.value = markdown;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '✓ Copied to clipboard!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            } catch (err) {
                alert('Failed to copy to clipboard');
            } finally {
                document.body.removeChild(textArea);
            }
        }

        // Start on load
        window.addEventListener('load', initHybridSort);
    </script>
</body>
</html>
